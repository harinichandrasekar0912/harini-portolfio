<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Personal portfolio website for Harini Chandrasekar."
    >
    <title>harini chandrasekar</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/motion.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/landing-girl-animation.css">
  </head>
  <body>
    <a class="skip-link" href="#work">skip to work</a>

    <main id="main">
      <section class="section landing-section" id="landing" tabindex="-1" aria-label="landing">
        <h1 class="site-name">harini chandrasekar</h1>
        <div
          class="landing-media"
          role="img"
          aria-label="black-and-white coded girl and thought animation"
        >
          <div class="landing-girl-animation" data-landing-girl-animation aria-hidden="true"></div>
        </div>
      </section>

      <section class="section about-section" id="about" tabindex="-1" aria-labelledby="about-heading">
        <h2 class="section-title" id="about-heading">about me</h2>
        <div class="section-inner about-layout">
          <figure class="about-portrait">
            <img
              src="assets/images/about/portrait-placeholder.svg"
              alt="Portrait placeholder for Harini Chandrasekar"
              width="720"
              height="900"
              sizes="(max-width: 760px) 78vw, 26vw"
              loading="lazy"
              decoding="async"
            >
          </figure>
          <div class="about-copy">
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer sed quiete lorem. Spatial things, drawn things and systems in between.</p>
          </div>
        </div>
      </section>

      <section class="section work-section" id="work" tabindex="-1" aria-labelledby="work-heading">
        <h2 class="section-title" id="work-heading">my works</h2>
        <ol class="work-list" aria-label="selected work">
          <li class="work-row work-row-left">
            <button class="work-tile" type="button" data-project-trigger="project-01" aria-label="open project 01">
              <img
                src="assets/images/work/project-01.svg"
                alt=""
                width="1200"
                height="960"
                sizes="(max-width: 760px) 100vw, 54vw"
                loading="lazy"
                decoding="async"
              >
            </button>
            <div class="work-space" aria-hidden="true"></div>
          </li>
          <li class="work-row work-row-right">
            <div class="work-space" aria-hidden="true"></div>
            <button class="work-tile" type="button" data-project-trigger="project-02" aria-label="open project 02">
              <img
                src="assets/images/work/project-02.svg"
                alt=""
                width="1200"
                height="960"
                sizes="(max-width: 760px) 100vw, 54vw"
                loading="lazy"
                decoding="async"
              >
            </button>
          </li>
          <li class="work-row work-row-left">
            <button class="work-tile" type="button" data-project-trigger="project-03" aria-label="open project 03">
              <img
                src="assets/images/work/project-03.svg"
                alt=""
                width="1200"
                height="960"
                sizes="(max-width: 760px) 100vw, 54vw"
                loading="lazy"
                decoding="async"
              >
            </button>
            <div class="work-space" aria-hidden="true"></div>
          </li>
          <li class="work-row work-row-right">
            <div class="work-space" aria-hidden="true"></div>
            <button class="work-tile" type="button" data-project-trigger="project-04" aria-label="open project 04">
              <img
                src="assets/images/work/project-04.svg"
                alt=""
                width="1200"
                height="960"
                sizes="(max-width: 760px) 100vw, 54vw"
                loading="lazy"
                decoding="async"
              >
            </button>
          </li>
          <li class="work-row work-row-left">
            <button class="work-tile" type="button" data-project-trigger="project-05" aria-label="open project 05">
              <img
                src="assets/images/work/project-05.svg"
                alt=""
                width="1200"
                height="960"
                sizes="(max-width: 760px) 100vw, 54vw"
                loading="lazy"
                decoding="async"
              >
            </button>
            <div class="work-space" aria-hidden="true"></div>
          </li>
        </ol>
      </section>

      <section class="section archive-section" id="archive" tabindex="-1" aria-labelledby="archive-heading">
        <h2 class="section-title" id="archive-heading">archive</h2>
        <div class="section-inner archive-layout">
          <div class="archive-empty" aria-hidden="true"></div>
          <ol class="archive-bars" aria-label="archive items">
            <li>
              <button class="archive-item archive-bar archive-bar-long" type="button" data-project-trigger="archive-01" aria-label="open archive item animation test">
                <img src="assets/images/archive/archive-placeholder.svg" alt="" width="1200" height="360" sizes="(max-width: 760px) 96vw, 58vw" loading="lazy" decoding="async">
                <span class="archive-bar-meta"><time datetime="2026">2026</time> animation test</span>
              </button>
            </li>
            <li>
              <button class="archive-item archive-bar archive-bar-medium" type="button" data-project-trigger="archive-02" aria-label="open archive item spatial sketch set">
                <img src="assets/images/archive/archive-placeholder.svg" alt="" width="1200" height="360" sizes="(max-width: 760px) 88vw, 48vw" loading="lazy" decoding="async">
                <span class="archive-bar-meta"><time datetime="2025">2025</time> spatial sketch set</span>
              </button>
            </li>
            <li>
              <button class="archive-item archive-bar archive-bar-short" type="button" data-project-trigger="archive-03" aria-label="open archive item material study">
                <img src="assets/images/archive/archive-placeholder.svg" alt="" width="1200" height="360" sizes="(max-width: 760px) 76vw, 38vw" loading="lazy" decoding="async">
                <span class="archive-bar-meta"><time datetime="2024">2024</time> material study</span>
              </button>
            </li>
            <li>
              <button class="archive-item archive-bar archive-bar-midshort" type="button" data-project-trigger="archive-04" aria-label="open archive item process fragment">
                <img src="assets/images/archive/archive-placeholder.svg" alt="" width="1200" height="360" sizes="(max-width: 760px) 82vw, 42vw" loading="lazy" decoding="async">
                <span class="archive-bar-meta"><time datetime="2023">2023</time> process fragment</span>
              </button>
            </li>
          </ol>
        </div>
      </section>

      <section class="section contact-section" id="contact" tabindex="-1" aria-labelledby="contact-heading">
        <h2 class="sr-only" id="contact-heading">get in touch with me</h2>
        <div class="section-inner contact-layout">
          <form class="contact-form" data-contact-form novalidate>
            <p class="contact-title" aria-hidden="true">get in touch with me</p>
            <label for="contact-name">
              <span class="sr-only">name</span>
              <input id="contact-name" type="text" name="name" autocomplete="name" placeholder="name" required>
            </label>
            <label for="contact-email">
              <span class="sr-only">email</span>
              <input id="contact-email" type="email" name="email" autocomplete="email" placeholder="email" required>
            </label>
            <label for="contact-message">
              <span class="sr-only">what would you like to say?</span>
              <textarea id="contact-message" name="message" rows="1" placeholder="what would you like to say?" data-auto-expand required></textarea>
            </label>
            <button class="submit-button" type="submit">go</button>
            <p class="form-response" data-form-response aria-live="polite"></p>
          </form>

          <nav class="contact-links" aria-label="contact links">
            <a href="#" aria-label="LinkedIn">
              <span class="contact-icon-placeholder" aria-hidden="true">in</span>
            </a>
            <a href="mailto:" aria-label="Email">
              <span class="contact-icon-placeholder" aria-hidden="true">@</span>
            </a>
            <a href="#" aria-label="Instagram">
              <span class="contact-icon-placeholder" aria-hidden="true">ig</span>
            </a>
            <a href="assets/documents/harini-chandrasekar-resume.pdf" download aria-label="Download resume">
              <span class="contact-icon-placeholder" aria-hidden="true">cv</span>
            </a>
          </nav>
        </div>
      </section>
    </main>

    <div class="viewport-edge-blur viewport-edge-blur-top" aria-hidden="true"></div>
    <div class="viewport-edge-blur viewport-edge-blur-bottom" aria-hidden="true"></div>

    <nav class="nav-object" data-nav-object aria-label="section navigation">
      <svg class="radial-lines" viewBox="0 0 380 180" aria-hidden="true" focusable="false">
        <line class="radial-line radial-line-about" x1="190" y1="138" x2="68" y2="50" pathLength="1"></line>
        <line class="radial-line radial-line-work" x1="190" y1="138" x2="142" y2="-6" pathLength="1"></line>
        <line class="radial-line radial-line-archive" x1="190" y1="138" x2="238" y2="-6" pathLength="1"></line>
        <line class="radial-line radial-line-contact" x1="190" y1="138" x2="312" y2="50" pathLength="1"></line>
      </svg>
      <ul class="radial-menu" id="radial-menu" aria-hidden="true">
        <li class="radial-item radial-item-about">
          <button type="button" data-nav-target="about" tabindex="-1">about</button>
        </li>
        <li class="radial-item radial-item-work">
          <button type="button" data-nav-target="work" tabindex="-1">work</button>
        </li>
        <li class="radial-item radial-item-archive">
          <button type="button" data-nav-target="archive" tabindex="-1">archive</button>
        </li>
        <li class="radial-item radial-item-contact">
          <button type="button" data-nav-target="contact" tabindex="-1">contact</button>
        </li>
      </ul>
      <button
        class="nav-core"
        type="button"
        data-nav-core
        aria-label="open navigation"
        aria-expanded="false"
        aria-controls="radial-menu"
      >
        <span class="nav-ring" aria-hidden="true">
          <svg viewBox="0 0 44 44" focusable="false">
            <circle cx="22" cy="22" r="20" pathLength="1"></circle>
          </svg>
        </span>
        <span class="plus-stem" aria-hidden="true"></span>
        <span class="plus-arm" aria-hidden="true"></span>
      </button>
    </nav>

    <div class="nav-travel-ball" data-travel-ball aria-hidden="true">
      <span class="travel-label" data-travel-label></span>
      <span class="travel-roll-detail" aria-hidden="true"></span>
      <span class="travel-shadow" aria-hidden="true"></span>
    </div>

    <div
      class="project-viewer"
      data-project-viewer
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="focused project view"
      tabindex="-1"
    >
      <div class="project-glass" aria-hidden="true"></div>
      <figure class="project-hero-frame" data-project-frame aria-hidden="true">
        <img alt="" data-project-hero>
      </figure>
      <div class="project-story" data-project-story>
        <div class="project-track" data-project-track></div>
      </div>
      <div class="project-progress" data-project-progress aria-hidden="true">
        <span data-project-progress-bar></span>
      </div>
      <button class="project-close" type="button" data-project-close aria-label="close project view">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>

    <script src="scripts/landing-girl-animation.js" defer></script>
    <script src="scripts/project-data.js" defer></script>
    <script src="scripts/navigation-ball.js" defer></script>
    <script src="scripts/project-viewer.js" defer></script>
    <script src="scripts/main.js" defer></script>
  </body>
</html>
